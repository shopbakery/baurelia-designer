# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c2843f28f7f4078230769fd7b5abfc9e"
name = "baurelia-designer"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects"
optional_scopes = [ ]
use_legacy_install_flow = false

[metaobjects.app.motif_category]
name = "Motivkategorie"
description = "Kategorien für die Motivauswahl im Baurelia Designer"
display_name_field = "name"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.motif_category.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.motif_category.fields.slug]
name = "Slug"
type = "single_line_text_field"
required = true

[metaobjects.app.motif_category.fields.description]
name = "Beschreibung"
type = "multi_line_text_field"

[metaobjects.app.motif_category.fields.sort_order]
name = "Reihenfolge"
type = "number_integer"
required = true

[metaobjects.app.motif_category.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[metaobjects.app.motif]
name = "Motiv"
description = "Ein Motiv mit Bilddatei auf Cloudflare R2"
display_name_field = "name"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.motif.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.motif.fields.slug]
name = "Slug"
type = "single_line_text_field"
required = true

[metaobjects.app.motif.fields.category]
name = "Kategorie"
type = "metaobject_reference<$app:motif_category>"
required = true

[metaobjects.app.motif.fields.category_handle]
name = "Kategorie-Handle"
type = "single_line_text_field"
required = true
capabilities.admin_filterable = true

[metaobjects.app.motif.fields.image_url]
name = "R2 Bild-URL"
type = "url"
required = true

[metaobjects.app.motif.fields.thumbnail_url]
name = "Vorschaubild-URL"
type = "url"

[metaobjects.app.motif.fields.r2_key]
name = "R2-Objektschlüssel"
type = "single_line_text_field"

[metaobjects.app.motif.fields.original_filename]
name = "Original-Dateiname"
type = "single_line_text_field"

[metaobjects.app.motif.fields.alt_text]
name = "Alternativtext"
type = "single_line_text_field"

[metaobjects.app.motif.fields.sort_order]
name = "Reihenfolge"
type = "number_integer"
required = true

[metaobjects.app.motif.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[metaobjects.app.customizer_color]
name = "Customizer-Farbe"
description = "Eine auswählbare Farbe im Baurelia Designer"
display_name_field = "name"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.customizer_color.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.customizer_color.fields.slug]
name = "Slug"
type = "single_line_text_field"
required = true

[metaobjects.app.customizer_color.fields.hex_value]
name = "Farbwert"
type = "color"
required = true

[metaobjects.app.customizer_color.fields.usage]
name = "Verwendung"
type = "single_line_text_field"

[metaobjects.app.customizer_color.fields.sort_order]
name = "Reihenfolge"
type = "number_integer"
required = true

[metaobjects.app.customizer_color.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[metaobjects.app.color_palette]
name = "Farbpalette"
description = "Gruppiert Farben für den Einsatz im Customizer"
display_name_field = "name"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.color_palette.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.color_palette.fields.slug]
name = "Slug"
type = "single_line_text_field"
required = true

[metaobjects.app.color_palette.fields.colors]
name = "Farben"
type = "list.metaobject_reference<$app:customizer_color>"

[metaobjects.app.color_palette.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[metaobjects.app.customizer_font]
name = "Customizer-Schrift"
description = "Eine auswählbare Schrift im Baurelia Designer"
display_name_field = "name"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.customizer_font.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.customizer_font.fields.slug]
name = "Slug"
type = "single_line_text_field"
required = true

[metaobjects.app.customizer_font.fields.font_family]
name = "CSS-Schriftfamilie"
type = "single_line_text_field"
required = true

[metaobjects.app.customizer_font.fields.font_url]
name = "Schriftdatei-URL"
type = "url"
required = true

[metaobjects.app.customizer_font.fields.woff2_url]
name = "WOFF2-Datei-URL"
type = "url"

[metaobjects.app.customizer_font.fields.ttf_url]
name = "TTF-Datei-URL"
type = "url"

[metaobjects.app.customizer_font.fields.preview_text]
name = "Vorschautext"
type = "single_line_text_field"

[metaobjects.app.customizer_font.fields.scale]
name = "Größenfaktor"
type = "number_decimal"
required = true

[metaobjects.app.customizer_font.fields.sort_order]
name = "Reihenfolge"
type = "number_integer"
required = true

[metaobjects.app.customizer_font.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[app_proxy]
url = "/api/customizer"
prefix = "apps"
subpath = "baurelia-designer"
