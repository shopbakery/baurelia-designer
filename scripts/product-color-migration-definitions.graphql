query ProductColorMigrationDefinitions {
  metafieldDefinitions(first: 50, ownerType: PRODUCT, namespace: "custom") {
    nodes {
      id
      name
      key
      type {
        name
      }
      validations {
        name
        value
      }
    }
  }
  metaobjectDefinitions(first: 100) {
    nodes {
      id
      name
      type
    }
  }
}
